<html>
<head>
<title>
   Add a Map with Markers using HTML
  </title>
<style>
   gmp-map {
          height: 100%;
      }
      html,
      body {
          height: 100%;
          margin: 0;
          padding: 0;
      }
  </style>
<script src="./index.js" type="module">
</script>
<script async="" src="https://maps.googleapis.com/maps/api/js?loading=async&amp;key=AIzaSyCqvuZ-XEhj-RSU30Q9eQEh6f475TwSjdQ&amp;libraries=maps,marker">
</script>
</head>
<body>
<gmp-map center="46.6400726,32.6283223" map-id="DEMO_MAP_ID" zoom="13">
<gmp-advanced-marker position="46.137642, 31.834805"></gmp-advanced-marker></gmp-map>
</body>
